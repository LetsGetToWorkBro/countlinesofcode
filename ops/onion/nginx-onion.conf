# 1999.LOC, served to Tor.
#
# The mirror is a reverse proxy and nothing else. Every link, stylesheet,
# script, image and API path on the site is written relative, so there is no
# HTML to rewrite on the way through: what the origin sends is what the onion
# serves, and "self" in the Content-Security-Policy resolves to the onion on
# its own. That is why this file is forty lines instead of a toolkit.
#
# Installed at /etc/nginx/sites-available/1999loc-onion by install.sh.

server {
    # Tor is the only thing that may reach this. It is not on a public
    # interface and it does not want to be.
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;
    access_log off;                 # a mirror that keeps no log keeps no log

    # Runtime DNS, so a Cloudflare address change does not strand the box on
    # an IP nginx resolved once at boot and cached forever.
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 5s;

    # The origin is addressed by name, because the name is what its
    # certificate is for and what the Worker routes on.
    proxy_set_header Host 1999loc.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # A visitor arrives here as a circuit rather than as an address, and
    # 127.0.0.1 is the whole truth about where the request came from. So no
    # X-Forwarded-For: there is nothing to forward, and inventing one would
    # hand the origin a fact the onion exists to withhold.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";

    # This hop is ordinary HTTPS across the ordinary internet and gets the
    # same scrutiny a browser would give it.
    proxy_ssl_server_name on;
    proxy_ssl_name 1999loc.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # Two headers must not survive the crossing:
    #   Strict-Transport-Security would tell the browser to demand https from
    #   an address that has no certificate and cannot be issued one;
    #   Onion-Location would have the mirror advertise itself to itself.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Onion-Location;

    # Anything the origin writes as an absolute redirect points at the
    # clearnet site. Bend it back onto the address the visitor is already on.
    proxy_redirect https://1999loc.com/ /;
    proxy_redirect http://1999loc.com/ /;

    client_max_body_size 32m;       # the tools take uploads
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        set $origin "1999loc.com";
        proxy_pass https://$origin$request_uri;
    }

    # The API is a relay to a Monero node, a block explorer or an exchange.
    # Buffering it would mean holding somebody's wallet query in this box's
    # memory for longer than the request it belongs to.
    location /api/ {
        set $origin "1999loc.com";
        proxy_pass https://$origin$request_uri;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# On caching, since its absence is deliberate: a shared proxy cache would tell
# one visitor, through response timing, which pages another visitor fetched
# recently. The origin is a Worker with its assets on a CDN edge and answers
# in single-digit milliseconds, which is nothing against six Tor hops. There
# is no speed here worth that side channel.
