#
# LOC.1999 — Cloudflare Worker (API) + static assets (the 1999 UI).
#
# The `[assets]` block is Cloudflare's current static-hosting story (it is what
# Pages became). Static files in ./public are served straight from the edge;
# anything that does not match a file falls through to the Worker in src/worker.
#
name = "loc1999"
main = "src/worker/index.ts"
compatibility_date = "2024-11-06"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# Unmatched paths must reach the Worker (it renders /r/:owner/:repo/:sha).
not_found_handling = "none"
# Serve /how.html at /how.html instead of 307-ing to /how. "/" is mapped to
# index.html by the Worker itself (see serveAsset in src/worker/index.ts).
html_handling = "none"

[observability]
enabled = true

# --- KV: result cache, ref->sha cache, OAuth sessions, IP rate limits --------
# Create with:  npx wrangler kv namespace create LOC_KV
#               npx wrangler kv namespace create LOC_KV --preview
[[kv_namespaces]]
binding = "LOC_KV"
id = "8c82bc2efc104b72b9b7e55aaebb4212"
preview_id = "ee8bb66dee884755b2487fbe011ca055"

[vars]
# APP_BASE_URL is deliberately not set anywhere: the Worker derives the OAuth
# redirect_uri from the origin of the incoming request, so it is correct on
# localhost, on *.workers.dev and on a custom domain without any edit. Set it
# only when a proxy in front rewrites the Host header.
# Hard limits (strings so they can be overridden per-environment).
MAX_FILES = "20000"
MAX_TOTAL_BYTES = "67108864"      # 64 MiB of decoded text
MAX_FILE_BYTES = "4194304"        # 4 MiB — bigger single files are skipped
MAX_BLOB_FETCHES = "40"           # above this many files we switch to tarball mode
FETCH_CONCURRENCY = "12"
RATE_LIMIT_PER_MINUTE = "20"      # per IP, unauthenticated

# Secrets (never put these here — use `wrangler secret put` / .dev.vars):
#   GITHUB_TOKEN            optional server token for anonymous requests
#   GITHUB_CLIENT_ID        OAuth app client id
#   GITHUB_CLIENT_SECRET    OAuth app client secret

[env.production]
name = "loc1999"
# Explicit rather than inherited: this is what gives you the
# https://loc1999.<your-subdomain>.workers.dev URL after `wrangler deploy`.
workers_dev = true

[env.production.vars]
# APP_BASE_URL is intentionally unset: the Worker falls back to the origin of
# the incoming request, so OAuth works on whatever hostname you deploy to
# (loc1999.<your-subdomain>.workers.dev, or a custom domain) with no edit.
# Set it explicitly only if you serve the app behind a proxy that rewrites Host.
# APP_BASE_URL = "https://loc.example.com"
MAX_FILES = "20000"
MAX_TOTAL_BYTES = "67108864"
MAX_FILE_BYTES = "4194304"
MAX_BLOB_FETCHES = "40"
FETCH_CONCURRENCY = "16"
RATE_LIMIT_PER_MINUTE = "20"

[[env.production.kv_namespaces]]
binding = "LOC_KV"
id = "8c82bc2efc104b72b9b7e55aaebb4212"

[env.production.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"
