#
# 1999.LOC — Cloudflare Worker (API) + static assets (the 1999 UI).
#
# The `[assets]` block is Cloudflare's current static-hosting story (it is what
# Pages became). Static files in ./public are served straight from the edge;
# anything that does not match a file falls through to the Worker in src/worker.
#
# ONE configuration, deliberately. Cloudflare's GitHub integration (Workers
# Builds) runs a plain `npx wrangler deploy`, with no `--env` flag. A separate
# `[env.production]` block would mean pushes deployed a different set of vars
# than manual deploys did, to the same Worker name — so there is only this one.
#
name = "loc1999"
main = "src/worker/index.ts"
compatibility_date = "2024-11-06"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# Unmatched paths must reach the Worker (it renders /r/:owner/:repo/:sha).
not_found_handling = "none"
# Serve /how.html at /how.html instead of 307-ing to /how. "/" is mapped to
# index.html by the Worker itself (see serveAsset in src/worker/index.ts).
html_handling = "none"

[observability]
enabled = true

# --- Custom domain ----------------------------------------------------------
# Live at https://1999loc.com, added through the dashboard (Workers & Pages ->
# loc1999 -> Settings -> Domains & Routes -> Add -> Custom domain). Nothing here
# needs to change for it: the Worker derives its own base URL from the request.
#
# To manage domains from this file instead, uncomment below — but only while the
# zone is active in the same Cloudflare account, otherwise EVERY deploy fails,
# including the automatic ones from GitHub.
# [[routes]]
# pattern = "1999loc.com"
# custom_domain = true
#
# [[routes]]
# pattern = "www.1999loc.com"
# custom_domain = true
#
# The bare domain is the canonical address. www.1999loc.com is also a custom
# domain, and the Worker 301s it to the apex (redirectFromWww in
# src/worker/index.ts).
#
# IMPORTANT, measured on the live site: that redirect only covers paths that
# reach the Worker. Cloudflare's asset router serves ./public files *before* the
# Worker runs, so on www:
#
#   /, /api/*, /sitemap.xml, /r/*   -> 301 to the apex   (Worker handles these)
#   /how.html, /style.css, ...      -> served directly    (asset router)
#
# The duplicates are harmless — every page carries a canonical tag pointing at
# the apex — but for a complete hostname redirect use a Cloudflare Redirect Rule,
# which runs at the edge above both:
#
#   Rules -> Redirect Rules -> Create
#     When: hostname equals www.1999loc.com
#     Then: dynamic redirect to concat("https://1999loc.com", http.request.uri.path)
#           status 301, preserve query string
#
# The alternative, `run_worker_first = true` in [assets], fixes it in code but
# turns every static asset request into a Worker invocation. Asset requests are
# otherwise free and unlimited, so that trade is usually not worth it.

# --- Plan notes -------------------------------------------------------------
# Counting is CPU-bound. Cloudflare allows 10 ms of CPU per request on the FREE
# plan and 30 s on PAID; the classifier runs at ~7 KB of source per ms.
#
#   FREE  counts small repositories on the server. Anything above
#         MAX_COUNT_BYTES is refused up front with an explanation, and the page
#         offers to count it in the visitor's browser instead — which has no
#         CPU limit, so no repository is out of reach.
#   PAID  MAX_COUNT_BYTES could be 32 MiB (~1M lines, ~4.8 s of CPU) or more.
#         This matters beyond convenience: only server-counted results are
#         cached, shareable and ranked on /board, because the server will not
#         rank numbers it did not produce. A low cap keeps the big repositories
#         off the leaderboards entirely.
#
# 32 MiB WAS TRIED HERE AND DOES NOT WORK. Measured against the live site with
# fresh=1, so every request did a full count:
#
#   ~1.9 MiB text (jquery, lodash)   reliable
#   ~2.5 MiB text (hono)             6 of 8 succeeded
#   ~3.0 MiB text (react-router)     1 of 8 succeeded
#   ~10  MiB text (date-fns)         1 of 8 succeeded
#
# The failures are Cloudflare `error code: 1102` — the isolate killed for
# exceeding resource limits, which no handler in this codebase can catch or
# explain. Whatever CPU this Worker actually gets, it is far below the paid
# plan's 30 s, and `[limits]` below cannot be used to raise it either.
#
# So the cap stays at the value that measurably works. Raise it only alongside a
# measurement, not a plan upgrade alone: scripts/archive-size.ts and a loop of
# `curl .../api/count/OWNER/REPO?fresh=1` are what produced the table above.
#
# Free also caps external subrequests at 50 (paid: 10,000), which is why
# MAX_BLOB_FETCHES is 40.
#
# Setting the CPU ceiling explicitly was tried and REJECTED by the build on
# 2026-08-03 (build 92ea2f09, commit 13ecb4e). `limits` needs the paid plan's
# Standard usage model, so this account does not currently have it. Leave this
# commented out until `npx wrangler deploy` accepts it, because a rejected
# wrangler.toml fails the whole build and freezes the site on its last good
# deploy — a much worse outcome than a conservative cap.
# [limits]
# cpu_ms = 30000

# --- KV: result cache, ref->sha cache, OAuth sessions, IP rate limits --------
# Created with:  npx wrangler kv namespace create LOC1999_KV
[[kv_namespaces]]
binding = "LOC_KV"
id = "8c82bc2efc104b72b9b7e55aaebb4212"
preview_id = "ee8bb66dee884755b2487fbe011ca055"

# --- D1: temporary-inbox storage --------------------------------------------
# Created with:  npx wrangler d1 create loc1999-tempmail   (already done; the id
# below is real, so this binding will not fail the build). Schema in
# migrations/0001_mailbox.sql, applied to the remote database out of band.
[[d1_databases]]
binding = "MAIL_DB"
database_name = "loc1999-tempmail"
database_id = "9dcf9dab-a5b2-46e9-b0c5-eb5a600e5871"
migrations_dir = "migrations"

# --- Cron: sweep expired throwaway messages ---------------------------------
# Every message also self-filters on expiry at read time, so this only reclaims
# space; a missed run leaks nothing.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# APP_BASE_URL is deliberately not set: the Worker derives the OAuth
# redirect_uri from the origin of the incoming request, so it is correct on
# localhost, on *.workers.dev and on a custom domain without any edit. Set it
# only when a proxy in front rewrites the Host header.
# Canonical origin for <link rel="canonical"> and the sitemap, so the
# *.workers.dev copy does not compete with the real domain in search results.
CANONICAL_ORIGIN = "https://1999loc.com"
MAX_FILES = "20000"
MAX_TOTAL_BYTES = "67108864"      # 64 MiB of decoded text
MAX_FILE_BYTES = "4194304"        # 4 MiB — bigger single files are skipped
MAX_BLOB_FETCHES = "40"           # above this many files we switch to tarball mode
# Pre-flight CPU guard — see "Plan notes" above. 2 MiB is the measured safe
# value on this deployment; anything above it fails most of the time.
MAX_COUNT_BYTES = "2097152"
FETCH_CONCURRENCY = "12"
RATE_LIMIT_PER_MINUTE = "20"      # per IP, unauthenticated
# The domain throwaway inbox addresses are handed out on. The tool is dark until
# Email Routing for this domain has its catch-all pointed at this Worker (see the
# runbook in docs/tempmail.md). A subdomain is used on purpose: a public throwaway
# inbox attracts spam and its addresses leak into lists, and keeping that off the
# apex protects the main domain's mail reputation. It costs nothing — the
# subdomain lives in the same Cloudflare zone (Email Routing -> Settings ->
# Subdomains), not a domain you buy. Change this to switch domains.
MAIL_DOMAIN = "mail.1999loc.com"

# Secrets (never put these here — this file is committed):
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
# Secrets are stored on the Worker and survive every deploy, including
# automatic ones from GitHub.
